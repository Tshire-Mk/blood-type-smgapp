<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyType • Red LIVE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif}
body{background:#0a0e1a;color:white;display:flex;justify-content:center;min-height:100vh}
.app{width:100%;max-width:430px;background:#0a0e1a;min-height:100vh;display:flex;flex-direction:column;position:relative}
.top{display:flex;justify-content:space-between;padding:14px 16px;background:rgba(255,255,255,0.08);backdrop-filter:blur(20px);border-radius:0 0 20px 20px;margin:0 8px}
.logo{font-weight:800;font-size:18px}.logo span{background:linear-gradient(135deg,#ff5a6a,#8aa7ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.badge{font-size:10px;padding:6px 10px;border-radius:20px;background:rgba(255,0,40,0.2);border:1px solid rgba(255,0,40,0.3)}
.screen{flex:1;padding:12px 12px 90px 12px;overflow:auto}
.card{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:18px;padding:14px;margin:8px 0}
.btn{width:100%;padding:14px;border:none;border-radius:100px;font-weight:800;color:white;background:linear-gradient(135deg,#ff2a45,#ff5a8a);cursor:pointer;margin-top:10px}
.input{width:100%;padding:14px;border-radius:14px;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.15);color:white;margin:6px 0;font-size:16px}
.chatBox{height:52vh;overflow:auto;padding:8px;display:flex;flex-direction:column;gap:10px;background:rgba(0,0,0,0.2);border-radius:18px;border:1px solid rgba(255,255,255,0.08)}
.bubble{padding:12px 14px;border-radius:18px;max-width:85%;font-size:13px;line-height:1.45}
.bubble.bot{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);align-self:flex-start}
.bubble.user{background:linear-gradient(135deg,#ff2a45,#ff5a8a);align-self:flex-end}
.qChips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.qChip{font-size:10px;padding:6px 10px;border-radius:20px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.15);cursor:pointer}
.botFab{position:fixed;bottom:20px;right:16px;width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,#ff1432,#960014);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:30;box-shadow:0 8px 24px rgba(255,0,40,0.5)}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;display:flex;justify-content:space-around;padding:10px;background:rgba(0,0,0,0.6);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,0.1)}
.navI{padding:8px 16px;border-radius:20px;cursor:pointer;font-size:11px;font-weight:700;color:rgba(255,255,255,0.5)}.navI.active{background:white;color:black}
</style>
</head>
<body>
<div class="app">
<div class="top"><div class="logo">MyType <span>Red LIVE</span></div><div class="badge">LIVE • api.mytypegroup.com</div></div>
<div id="s-home" class="screen" style="display:flex;flex-direction:column">
<div class="card" style="text-align:center"><div style="font-size:44px">🔴</div><h2>I am Red — Health Advisor</h2><p style="font-size:12px;opacity:0.6;margin-top:6px">I am Red — I chat like Meta AI. Ask about juice, tired, pap-only, sleep.</p></div>
<div class="card"><h3 style="font-size:13px;margin-bottom:8px">💬 Chat with Red</h3><div id="chatBox" class="chatBox"></div>
<div style="display:flex;gap:8px;margin-top:8px"><input id="chatInput" class="input" placeholder="Ask Red: What juice is best for me?" style="margin:0" onkeydown="if(event.key==='Enter')sendChat()"><button onclick="sendChat()" style="padding:12px 16px;border-radius:14px;border:none;background:#ff2a45;color:white;font-weight:800;cursor:pointer">Send</button></div>
</div>
<div class="card"><div style="font-size:11px;opacity:0.6">SHOP • Basket: <span id="bCount">0</span></div><div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"><span style="font-size:11px;padding:6px 10px;background:rgba(255,255,255,0.08);border-radius:20px">Eggs 6 R42.99</span><span style="font-size:11px;padding:6px 10px;background:rgba(255,255,255,0.08);border-radius:20px">Spinach R29.99</span><span style="font-size:11px;padding:6px 10px;background:rgba(255,255,255,0.08);border-radius:20px">Lamb 500g R189.99</span></div></div>
</div>
<div id="s-s1" class="screen" style="display:none"><div class="card"><h2>Welcome</h2><p style="font-size:12px;opacity:0.6;margin-top:6px">Create profile to unlock Red</p><input id="inName" class="input" placeholder="Name (e.g. Tshire)"><select id="inType" class="input"><option value="">Blood Type</option><option>O+</option><option>O-</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option></select><button class="btn" onclick="saveP()">Unlock Red →</button></div></div>
<div class="nav"><div class="navI active" onclick="go('home')">Home</div><div class="navI" onclick="go('s1')">Profile</div><div class="navI" onclick="document.getElementById('chatInput').focus()">Red</div></div>
</div>
<script>
const RED_API_PRIMARY = "https://api.mytypegroup.com/red";
const RED_API_FALLBACK = "https://mytype-red-ai.tshireletsowanele.workers.dev/red";
const RED_APIS = [RED_API_PRIMARY, RED_API_FALLBACK];
let s=JSON.parse(localStorage.getItem('mytype_v4')||'{"name":"","type":"","basket":[],"botLog":[],"botState":{}}');
function go(id){document.querySelectorAll('.screen').forEach(e=>e.style.display='none');document.getElementById('s-'+id).style.display='flex';}
function saveP(){let n=document.getElementById('inName').value.trim();let t=document.getElementById('inType').value;if(!n||!t){alert('Name + type needed');return;}s.name=n;s.type=t;localStorage.setItem('mytype_v4',JSON.stringify(s));renderBot();go('home');}
function renderBot(){let box=document.getElementById('chatBox');if(!box)return;if(!s.name||!s.type){box.innerHTML=`<div class="bubble bot">🔒 Red locked — create profile first! I am Red, your advisor.</div>`;return;}box.innerHTML='';if(!s.botLog?.length){addBot(`Hey ${s.name} — I am Red 🔴 your health advisor\n\nI am Red — I chat like a human advisor, not a robot. Ask me about juice, tired, pap-only, sleep, water — I will sit with you and make a plan for your ${s.type}.\n\nTry: 'What juice is best for me?'`,["What juice is best for me?","I'm tired today","Best foods for "+s.type]);}else{s.botLog.forEach(m=>{addBot(m.text,m.chips,m.role=='user',false);});}}
function addBot(t,isUser=false,save=true,chips=null){let box=document.getElementById('chatBox');let d=document.createElement('div');d.className='bubble '+(isUser?'user':'bot');d.innerHTML=t.replace(/\n/g,'<br>')+(chips?`<div class="qChips">${chips.map(c=>`<span class="qChip" onclick="quick('${c}')">${c}</span>`).join('')}</div>`:'');box.appendChild(d);box.scrollTop=box.scrollHeight;if(save){s.botLog=s.botLog||[];s.botLog.push({role:isUser?'user':'bot',text:t,chips});localStorage.setItem('mytype_v4',JSON.stringify(s));document.getElementById('bCount').textContent=s.basket?.length||0;}}
function quick(t){document.getElementById('chatInput').value=t;sendChat();}
function fallbackLogic(txt){let l=txt.toLowerCase();let reply=`Hello ${s.name||'there'}, nice to see you. I am Red. How's your day going so far? Have you been feeling energized and focused, or is there something that's been bothering you lately? Maybe we can start with how you've been sleeping and if you've noticed any changes in your energy levels?`;let chips=["Best juice for "+(s.type||'me')+"?","Why am I tired?","My plan for "+(s.type||'me')];if(l.includes('juice')){reply=`Good question ${s.name}! I am Red, your advisor.\n\nFor ${s.type} like you, orange juice 150ml WITH iron meal helps Vitamin C absorb iron 2x better. Beetroot juice 2-3x week boosts blood flow — great if dizzy/tired. We have Beetroot 500g R24.99.\n\nHow much juice do you drink now?`;}addBot(reply,false,true,chips);}
async function callRedAPI(query){let history=[];try{if(s.botLog?.length)history=s.botLog.slice(-8).map(m=>({role:m.role==='user'?'user':'assistant',content:(m.text||'').slice(0,600)}));}catch(e){}let payload={query,history,profile:{name:s.name,type:s.type,botState:s.botState}};for(const url of RED_APIS){try{console.log('Red trying',url);let ctrl=new AbortController();let to=setTimeout(()=>ctrl.abort(),20000);let res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:ctrl.signal});clearTimeout(to);if(!res.ok)throw new Error('HTTP '+res.status);let data=await res.json();if(data&&data.answer)return data;}catch(e){console.log('Red fail',url,e.message);continue;}}return null;}
async function sendChat(){let input=document.getElementById('chatInput');let txt=input.value.trim();if(!txt)return;if(!s.name||!s.type){alert('Create profile first!');go('s1');return;}addBot(txt,true);input.value='';let thinking=document.createElement('div');thinking.className='bubble bot';thinking.id='thinking';thinking.innerHTML='Red is typing... 🔴 LIVE';document.getElementById('chatBox').appendChild(thinking);let data=await callRedAPI(txt);let th=document.getElementById('thinking');if(th)th.remove();if(data&&data.answer){let full=data.answer;if(data.sources)full+="\n\n📚 "+data.sources.join(', ');if(data.disclaimer)full+="\n\n⚠️ "+data.disclaimer;addBot(full,false,true,data.chips);}else{fallbackLogic(txt);}}
renderBot();if(s.name&&s.type)go('home');else go('s1');
</script>
</body>
</html>
